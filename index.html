<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YAISKHA PORTAL</title>

<style>

body{
margin:0;
padding:0;
font-family:Arial,sans-serif;
background:linear-gradient(180deg,#001a1a,#000814);
color:white;
text-align:center;
overflow-x:hidden;
}

h1{
margin-top:40px;
font-size:32px;
color:#7fffd4;
text-shadow:0 0 15px #00ffaa;
animation:pulse 2s infinite;
}

.card{
background:linear-gradient(135deg,#003333,#001f3f);
margin:25px auto;
padding:30px;
width:85%;
max-width:500px;
border-radius:20px;
box-shadow:0 0 20px #00ffaa;
transition:0.3s;
}

.card:hover{
transform:scale(1.03);
box-shadow:0 0 30px #00ffee;
}

h2{
color:#7fffd4;
}

p{
color:#d0ffff;
}

.btn{
margin-top:15px;
padding:12px 25px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#00ffaa,#00ccff);
color:black;
font-weight:bold;
cursor:pointer;
font-size:15px;
transition:0.3s;
}

.btn:hover{
transform:scale(1.05);
box-shadow:0 0 15px #00ffee;
}

@keyframes pulse{
0%{
text-shadow:0 0 10px #00ffaa;
}
50%{
text-shadow:0 0 25px #00ffee;
}
100%{
text-shadow:0 0 10px #00ffaa;
}
}

</style>
</head>

<body>

<h1>🌐 YAISKHA PORTAL</h1>

<div class="card">
<h2>📞 Hubungi Kami</h2>
<p>Kontak resmi Yayasan Islam Siti Khadijah</p>

<a href="hubungi.html">
<button class="btn">Masuk</button>
</a>
</div>

<div class="card">
<h2>📖 Sejarah YAISKHA</h2>
<p>Informasi dan sejarah yayasan</p>

<button class="btn">Lihat</button>
</div>

</body>
</html>
